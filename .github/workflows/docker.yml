name: Deploy Server to Railway

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/docker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Railway deployment
        run: |
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation { serviceInstanceDeploy(environmentId: \\\"f5f4ef87-1dcf-4d4c-bc88-8fcc5d485e33\\\", serviceId: \\\"7c00e772-33a7-4100-81dc-1065ec9d736f\\\", commitSha: \\\"${{ github.sha }}\\\") }\"
            }" | tee /tmp/railway_response.json
          cat /tmp/railway_response.json | python3 -c "import json,sys; r=json.load(sys.stdin); print('Deployed!' if r.get('data',{}).get('serviceInstanceDeploy') else f'Error: {r}')"
